name: Type Checking

on: [push, pull_request]

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --all-extras --locked --python 3.11

      - name: Mypy (backend)
        run: cd backend && uv run --no-sync mypy src scripts migrations tests --config-file pyproject.toml
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only

      - name: Mypy (cli)
        run: cd cli && uv run --no-sync mypy -p cli
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only

      - name: Mypy (tools)
        run: uv run --no-sync mypy tools
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only
