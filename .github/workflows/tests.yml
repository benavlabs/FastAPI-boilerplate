name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --all-extras --locked --python 3.11

      - name: Pytest (backend)
        # --no-sync skips uv run's implicit sync: the step above already installed
        # every member and extra, and skipping it keeps each step from re-resolving.
        run: cd backend && uv run --no-sync pytest
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only

      - name: Pytest (blueprint)
        run: uv run --no-sync pytest blueprint/tests

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - core-only
          - core-taskiq
          - accounts-only
          - accounts-rbac
          - accounts-admin
          - accounts-api-keys
          - accounts-rbac-tiers
          - accounts-cache-taskiq
          - minimal
          - standard
          - full
          - everything
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --all-extras --locked --python 3.11

      - name: Verify
        run: uv run --no-sync fastro blueprint verify ${{ matrix.preset }}
